name: Release

# Every push to master runs the same Zip and Installer solution configurations the
# maintainer runs from Visual Studio (see SquirrelRelease.txt), squirrel releasify
# included, so a break in packaging surfaces on the commit that caused it.
#
# Publishing is what the version gates. A GitHub release is keyed by its tag, so
# only a push whose AssemblyVersion in Heroesprofile.Uploader.Windows\Properties# AssemblyInfo.cs has no release yet goes out - bumping it is how you say "ship
# this". Everything else builds, reports, and stops short of publishing.
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      # Heroes.ReplayParser is a submodule, and the solution will not restore without it
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # The runner image does not always carry the 4.6.2 reference assemblies,
      # and without them the build dies with MSB3644.
      - name: Ensure .NET Framework 4.6.2 targeting pack
        shell: pwsh
        run: |
          $ref = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.6.2"
          if (-not (Test-Path $ref)) {
            choco install netfx-4.6.2-devpack -y --no-progress
          }

      - uses: microsoft/setup-msbuild@v2

      # AssemblyInfo.cs is the single source of truth for the version. A tag push
      # has to agree with it; a branch push or manual run takes it from there.
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assemblyInfo = Get-Content 'Heroesprofile.Uploader.Windows\Properties\AssemblyInfo.cs' -Raw
          if ($assemblyInfo -notmatch '(?m)^\[assembly: AssemblyVersion\("(\d+\.\d+\.\d+)') {
            throw "Could not read a three-part AssemblyVersion out of AssemblyInfo.cs"
          }
          $version = $Matches[1]

          if ("${{ github.ref_type }}" -eq 'tag') {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v$version"
            Write-Host "Running from a branch, so taking the tag from AssemblyVersion: $tag"
          }

          if ($tag.TrimStart('v') -ne $version) {
            throw "Tag $tag does not match AssemblyVersion $version - bump AssemblyInfo.cs and retag"
          }

          # Actions runs pwsh with -ErrorActionPreference Stop, which by default
          # turns a non-zero exit from a native command into a terminating error,
          # and "no such release" is exactly the answer being asked for here.
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag *> $null
          $exists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $true
          # Actions ends every pwsh step with `exit $LASTEXITCODE`, so a handled
          # non-zero from gh still fails the step unless it is cleared
          $global:LASTEXITCODE = 0

          # Not an error: most pushes are ordinary commits at a version that has
          # already shipped. They still get built and packaged, just not published.
          $publish = (-not $exists).ToString().ToLower()
          if ($exists) {
            $summary = "Release **$tag** already exists - built and packaged, but not published. Bump AssemblyVersion to ship."
          } else {
            $summary = "Version **$tag** has no release yet - this run will publish it."
          }
          Write-Host $summary
          $summary | Out-File $env:GITHUB_STEP_SUMMARY -Append

          "tag=$tag"         | Out-File $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          "publish=$publish" | Out-File $env:GITHUB_OUTPUT -Append

      # Squirrel builds the delta against the previous -full.nupkg and appends to
      # the existing RELEASES index. Neither is in git, so pull them back off the
      # last published release or every build would ship a full-only feed.
      - name: Seed Releases folder from the previous release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force Releases | Out-Null
          $previous = gh release list --limit 1 --json tagName --jq '.[0].tagName'
          if (-not $previous) {
            Write-Host "No previous release found, this build will publish a full package only"
            return
          }
          Write-Host "Seeding from $previous"
          $PSNativeCommandUseErrorActionPreference = $false
          gh release download $previous --dir Releases --pattern 'RELEASES' --pattern '*-full.nupkg'
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Could not seed from $previous - this build will publish a full package only"
          }
          $global:LASTEXITCODE = 0

      - name: Restore
        run: msbuild Heroesprofile.Uploader.sln -t:Restore -v:minimal

      # Both configurations write into .\Releases. Keep building the solution
      # rather than the project: the .sln is what pins Heroes.ReplayParser to
      # Debug and Common to Release under these configurations.
      - name: Build zip
        run: msbuild Heroesprofile.Uploader.sln -p:Configuration=Zip -v:minimal -m

      - name: Build installer
        run: msbuild Heroesprofile.Uploader.sln -p:Configuration=Installer -v:minimal

      - name: Check the assets are all there
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $expected = @(
            "Releases\RELEASES",
            "Releases\HeroesProfileUploaderSetup.exe",
            "Releases\HeroesProfile.zip",
            "Releases\Heroesprofile.Uploader-$version-full.nupkg"
          )
          $missing = $expected | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Build did not produce: $($missing -join ', ')" }
          # a non-publishing run never seeds, so it has nothing to diff against and
          # a missing delta says nothing
          if ("${{ steps.version.outputs.publish }}" -eq 'true' -and
              -not (Test-Path "Releases\Heroesprofile.Uploader-$version-delta.nupkg")) {
            Write-Warning "No delta package - existing installs will take the full download"
          }

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          # version-globbed: the seed step left the previous release's full package in here too
          $assets = @(
            "Releases\RELEASES",
            "Releases\HeroesProfileUploaderSetup.exe",
            "Releases\HeroesProfile.zip"
          ) + (Get-ChildItem "Releases\Heroesprofile.Uploader-$version-*.nupkg" | ForEach-Object { $_.FullName })
          # --target places the tag when it does not exist yet (a manual run);
          # it is ignored when the tag was pushed
          gh release create $tag $assets --title $tag --generate-notes --target ${{ github.sha }}
